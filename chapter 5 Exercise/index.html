<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Psychedelic Fish Audio Sampler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🐟 PSYCHEDELIC FISH</h1>
    <h2 id="bankTitle">Sample Bank 1</h2>
  </header>

  <main class="container">

    <section class="speech-box">
      <textarea id="speechText" placeholder="Type Here"></textarea>
      <button id="sayBtn">Say it</button>
    </section>

    <section class="samples" id="samples"></section>

  </main>

  <div class="arrows">
    <button id="leftBtn">⬅</button>
    <button id="rightBtn">➡</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
