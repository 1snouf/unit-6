<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petrol Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main petrol calculator section -->
  <main class="calculator">
    <h1>Petrol Calculator</h1>
    <p>Calculate the total cost of petrol purchased.</p>

    <!-- Input for petrol price per liter -->
    <label for="price">Petrol cost per liter</label>
    <input type="number" id="price" value="1.72" step="0.01">

    <!-- Input for liters purchased -->
    <label for="liters">Liters purchased</label>
    <input type="number" id="liters" value="0" step="0.01">

    <!-- Button to calculate total cost -->
    <button id="calculateBtn">Calculate Total</button>

    <!-- Result will appear here -->
    <p id="result">Total cost: 0.00</p>
  </main>

  <script src="index.js"></script>
</body>
</html>
